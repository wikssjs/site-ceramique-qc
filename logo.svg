<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 224 44" fill="none">
  <!-- 2x2 tile grid icon -->
  <rect x="0"  y="0"  width="14" height="14" rx="2" fill="#c026d3"/>
  <rect x="16" y="0"  width="14" height="14" rx="2" fill="#c026d3" opacity=".65"/>
  <rect x="0"  y="16" width="14" height="14" rx="2" fill="#c026d3" opacity=".65"/>
  <rect x="16" y="16" width="14" height="14" rx="2" fill="#c026d3" opacity=".35"/>
  <!-- grout lines -->
  <line x1="15" y1="0"  x2="15" y2="30" stroke="white" stroke-width="2"/>
  <line x1="0"  y1="15" x2="30" y2="15" stroke="white" stroke-width="2"/>
  <!-- text -->
  <text x="40" y="19" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="400" fill="#701a75" letter-spacing="0.5">PRIX</text>
  <text x="40" y="36" font-family="system-ui,-apple-system,sans-serif" font-size="17" font-weight="700" fill="#a21caf" letter-spacing="-0.3">Céramique</text>
</svg>
